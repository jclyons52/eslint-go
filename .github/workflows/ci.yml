name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install the npm oracle
        run: npm ci --omit=dev --prefix oracle
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: end-to-end CLI parity
        run: bash scripts/e2e.sh
      - name: declared oracle-case count
        run: bash scripts/rule-case-count.sh
      - name: dogfood (differential lint of real npm code)
        # Fails on a crash or an unexplained divergence. Hand-written rule
        # corpora cannot contain the shapes shipped packages use: this step is
        # what caught a shebang/`"use strict"` panic and an octal-escape panic
        # that 2,461 corpus cases never touched.
        run: python3 scripts/dogfood.py --limit 250
